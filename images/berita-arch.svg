  <line x1="512" y1="122" x2="512" y2="148" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="512" y1="148" x2="248" y2="148" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="248" y1="148" x2="248" y2="162" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#berita-arrow)"/>

