<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="베리타 뉴스레터 운영 아키텍처">
  <defs>
    <marker id="berita-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="berita-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="berita-arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/>
    </marker>
    <marker id="berita-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/>
    </marker>
    <marker id="berita-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="920" height="400" fill="#161b22" rx="12"/>

  <!-- 상단 요약 -->
  <text x="460" y="22" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">Gmail → n8n → 섹션 API → DB → 관리자 → ait build → 토스 미니앱</text>

  <!-- 레인 구분선 -->
  <line x1="110" y1="138" x2="760" y2="138" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="268" x2="760" y2="268" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 레인 라벨 -->
  <text x="24" y="30" fill="#d29922" font-size="10" font-weight="700" font-family="system-ui,sans-serif">수집 · 자동화</text>
  <text x="24" y="160" fill="#bc8cff" font-size="10" font-weight="700" font-family="system-ui,sans-serif">저장 · 검수</text>
  <text x="24" y="290" fill="#3fb950" font-size="10" font-weight="700" font-family="system-ui,sans-serif">배포 · 서비스</text>

  <!-- ===== Row 1: 수집 ===== -->
  <rect x="130" y="48" width="96" height="68" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
