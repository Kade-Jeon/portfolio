  <line x1="328" y1="206" x2="406" y2="206" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#berita-arrow-purple)"/>
  <line x1="406" y1="214" x2="328" y2="214" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#berita-arrow-muted)"/>

