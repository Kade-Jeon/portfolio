  <text x="248" y="208" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">Supabase</text>
  <text x="248" y="222" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">섹션 단위 저장</text>
