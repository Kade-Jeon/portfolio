  <text x="178" y="92" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">특정 메일함</text>
  <text x="178" y="106" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">토픽 후보</text>

  <rect x="270" y="42" width="120" height="80" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="330" y="72" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">n8n</text>
  <text x="330" y="88" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">Windows PC</text>
  <text x="330" y="102" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">24시간 워크플로우</text>
  <text x="330" y="116" fill="#d29922" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">자동 수집</text>

  <rect x="434" y="42" width="156" height="80" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="512" y="68" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">Supabase Edge</text>
  <text x="512" y="84" fill="#8b949e" font-size="8" text-anchor="middle" font-family="system-ui,sans-serif">create-newsletter-section</text>
  <text x="512" y="98" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">x-n8n-secret</text>
  <text x="512" y="112" fill="#58a6ff" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">섹션 API</text>

  <line x1="226" y1="82" x2="268" y2="82" stroke="#d29922" stroke-width="1.5" marker-end="url(#berita-arrow-yellow)"/>
  <line x1="390" y1="82" x2="432" y2="82" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#berita-arrow)"/>

