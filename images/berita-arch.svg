  <text x="484" y="322" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">베리타</text>
  <text x="484" y="338" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">토스 미니앱</text>
  <text x="484" y="352" fill="#58a6ff" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">TDS Mobile</text>

  <rect x="588" y="292" width="120" height="72" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="648" y="322" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">토스 사용자</text>
  <text x="648" y="338" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">미니앱 검색</text>
  <text x="648" y="352" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">뉴스레터 열람</text>

  <line x1="228" y1="328" x2="266" y2="328" stroke="#3fb950" stroke-width="1.5" marker-end="url(#berita-arrow-green)"/>
  <line x1="380" y1="328" x2="418" y2="328" stroke="#3fb950" stroke-width="1.5" marker-end="url(#berita-arrow-green)"/>
  <line x1="548" y1="328" x2="586" y2="328" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#berita-arrow)"/>

  <!-- 범례 -->
  <rect x="748" y="44" width="148" height="96" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="822" y="64" fill="#8b949e" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">범례</text>
  <circle cx="768" cy="78" r="4" fill="#d29922"/>
  <text x="780" y="82" fill="#8b949e" font-size="8" font-family="system-ui,sans-serif">자동 수집</text>
  <circle cx="768" cy="94" r="4" fill="#bc8cff"/>
  <text x="780" y="98" fill="#8b949e" font-size="8" font-family="system-ui,sans-serif">운영자 검수</text>
  <circle cx="768" cy="110" r="4" fill="#3fb950"/>
  <text x="780" y="114" fill="#8b949e" font-size="8" font-family="system-ui,sans-serif">배포 · 서비스</text>
  <circle cx="768" cy="126" r="4" fill="#58a6ff"/>
  <text x="780" y="130" fill="#8b949e" font-size="8" font-family="system-ui,sans-serif">API · 데이터</text>
</svg>
