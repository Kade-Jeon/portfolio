  <rect x="408" y="162" width="200" height="88" rx="10" fill="#21262d" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="508" y="188" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">newsletter-admin</text>
  <text x="508" y="204" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">섹션 검수 · 선정</text>
  <text x="508" y="218" fill="#bc8cff" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">운영자 직접 수정 · 보강</text>
  <text x="508" y="232" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">뉴스레터 발행</text>
  <text x="508" y="246" fill="#bc8cff" font-size="8" text-anchor="middle" font-family="system-ui,sans-serif">semi-automated</text>

