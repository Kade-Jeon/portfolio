  <line x1="508" y1="250" x2="508" y2="268" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="508" y1="268" x2="168" y2="268" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="168" y1="268" x2="168" y2="292" stroke="#3fb950" stroke-width="1.5" marker-end="url(#berita-arrow-green)"/>

