  <text x="168" y="338" fill="#8b949e" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">React / Granite</text>
  <text x="168" y="352" fill="#3fb950" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">ait build</text>

  <rect x="268" y="292" width="112" height="72" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
